# EPOCH 2: resumes from the epoch-1 checkpoint (update 1063) of the crashed run vlajepa_libero_ft_future_from_libero.
# Weights only: optimizer/scheduler restart (short warmup, then cosine decay). Trains only action_model.world_model_attention.
# Finetune from the released LIBERO checkpoint, training only the new world-model cross-attention blocks, 2 epochs.
# Derived from vlajepa_libero_ft_future.yaml (paper settings: batch 256, LRs).
run_id: vlajepa_libero_ft_future_from_libero_ep2
run_root_dir: /mnt/GuestShare_NAS/WorkingSpace/Personal/nguyenmv/ActionChunking/VLA-JEPA/runs
seed: 42
trackers:
- json
is_debug: false
framework:
  name: VLA_JEPA_future
  qwenvl:
    base_vlm: /mnt/GuestShare_NAS/WorkingSpace/Personal/nguyenmv/ActionChunking/VLA-JEPA/checkpoints/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 8
    future_action_window_size: 6
    action_horizon: 7
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    head_type: groot_future        # groot = original GR00T head | groot_future = + world-model cross-attention
    world_model_attention:         # read by GR00T_ActionHeader_Future.py (NOT passed to the DiT)
      type: mha                    # torch nn.MultiheadAttention blocks
      position: pre_dit            # pre_dit: Q = sa_embs (768, then all 16 DiT layers see it) | post_dit: Q = DiT output (1024)
      num_layers: 4                # stacked world-model cross-attention blocks
      num_heads: 12                # 768 / 12 = 64 per head (post_dit: use 8 or 16 to divide 1024)
      dropout: 0.1
      norm_type: ada_norm          # timestep-conditioned pre-norm like the DiT blocks | layer_norm | none
      use_ffn: true
      ffn_ratio: 4                 # FFN hidden = 4 x query dim
      gate: tanh_zero              # residual gates start at 0: exact no-op on the pretrained head at step 0
      pool_size: 8                 # each WM step's 16x16 patch grid -> 8x8: 3 steps x 64 = 192 K/V tokens
      detach_wm: true              # action loss does not backprop into the world model
      # kdim: set by VLA_JEPA_Future.__init__ = V-JEPA hidden size x 2 views (2048); output dim = query dim (residual)
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  vj2_model:
    base_encoder: /mnt/GuestShare_NAS/WorkingSpace/Personal/nguyenmv/ActionChunking/VLA-JEPA/checkpoints/vjepa2-vitl-fpc64-256
    num_frames: 8
    depth: 12
    num_heads: 8
    special_action_token: <|action_{}|>
    num_action_tokens_per_timestep: 8
    embodied_action_token: <|embodied_action|>
    num_embodied_action_tokens_per_instruction: 32
  reduce_in_full_precision: true
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /mnt/GuestShare_NAS/WorkingSpace/Personal/nguyenmv/ActionChunking/VLA-JEPA/data/libero_lerobot
    data_mix: libero_all
    action_type: delta_qpos
    CoT_prompt: Your task is {instruction}. Infer the temporal dynamics from frames
      {actions} and produce the corresponding policy actions {e_actions}.
    resolution_size: 224
    per_device_batch_size: 2           # paper A.2: 32/GPU x 8 GPUs = 256. Here 2/GPU x 2 GPUs (6,7) x 64 accum (DeepSpeed acc64 config) = 256
    load_all_data_for_training: true
    action_horizon: 7
    with_state: true
trainer:
  epochs: 100
  max_train_steps: 1063               # 2 epochs: 2 x 272,104 samples / 256 per update (1 step = 1 real optimizer update)
  num_warmup_steps: 177               # 1/6 of the run (repo ratio 20K/120K)
  save_interval: 532                  # = 1 epoch
  eval_interval: 100
  learning_rate:
    base: 3.0e-05
    qwen_vl_interface: 1.0e-05         # paper A.2: 1e-5 for the VLM
    action_model: 0.0001               # paper A.2: 1e-4 for the action head
    vj_predictor: 0.0005               # authors' repo config (paper A.2 says 1e-5 for the latent world model; kept repo value on purpose)
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-05
  freeze_modules: ''
  trainable_modules: action_model.world_model_attention   # train ONLY the new WM cross-attention blocks; rest frozen
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  pretrained_checkpoint: /mnt/GuestShare_NAS/WorkingSpace/Personal/nguyenmv/ActionChunking/VLA-JEPA/runs/vlajepa_libero_ft_future_from_libero/checkpoints/steps_1063_pytorch_model.pt   # epoch-1 weights of the crashed run (crash at update ~1153)
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
